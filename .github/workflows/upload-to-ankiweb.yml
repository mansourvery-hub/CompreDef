name: Upload to AnkiWeb
# NOTE for future agents: This workflow runs on GitHub's ubuntu-latest
# where no local Anki profile exists, so it does NOT do a local install.
# The local auto-install mandate (AGENTS.md §9) is fulfilled by the *local*
# scripts: scripts/build.sh [4/4], scripts/ci.sh [5/5], scripts/release.sh [6/6]
# all end with ./scripts/install_local.sh — keep that as the final step.
on:
  release:
    types: [published]

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download release asset
        uses: robinraju/release-downloader@v1.11
        with:
          fileName: "CompreDef.ankiaddon"
          latest: true

      - name: Upload to AnkiWeb
        uses: danny900714/upload-anki-addon@v1.0.0
        with:
          username: ${{ secrets.ANKI_WEB_USERNAME }}
          password: ${{ secrets.ANKI_WEB_PASSWORD }}
          addon-id: "1619602654"
          title: "CompreDef"
          branches: 23.10.0-26.08+
          addon-files: CompreDef.ankiaddon
          description: "Generates Japanese definitions tailored to your known kanji and vocabulary. Uses a user-ordered ladder of local Yomitan dictionaries (first fully comprehensible definition wins — put the richest dictionary you can read on top). Tab-to-Generate fills empty definition fields automatically. Pure local SQLite lookups — no LLMs, no network calls."
